name: Bug report
description: Something broke or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: input
    id: model-size
    attributes:
      label: Model face count
      description: Several bugs only reproduce on 1M+ face meshes — check the status bar.
      placeholder: "e.g. 1,499,964"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: "e.g. 0.1.0 or commit hash"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
      description: Visual bugs need screenshots. Crash logs go here too.
