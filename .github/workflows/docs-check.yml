# Keeps the colocated HTML archives in sync with the markdown sources:
# rebuilds and fails if any *.html in the repo differs (including missing
# new archives). Remedy when it fails: run `npm run docs:build` and commit.

name: Docs freshness

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "tools/build_docs.mjs"
      - "tools/docs_site.css"
      - "package-lock.json"
      - ".gitattributes"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "tools/build_docs.mjs"
      - "tools/docs_site.css"
      - "package-lock.json"
      - ".gitattributes"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: Fail if HTML archives are stale
        run: |
          dirty="$(git status --porcelain --untracked-files=all -- '*.html')"
          if [ -n "$dirty" ]; then
            echo "HTML archives are out of date. Run 'npm run docs:build' and commit:"
            echo "$dirty"
            exit 1
          fi
