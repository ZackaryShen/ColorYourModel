# Frontend + Rust unit tests on every push to main and all PRs, on both
# Linux and Windows. Docs freshness is covered separately by docs-check.yml.
#
# Since 0.2.0-P0 every step below is a hard gate: the 3 pre-existing SeedPanel
# selector failures were fixed and vitest is 60/60. Windows coverage matters
# because the auto-update module only runs there (see CHANGELOG "Known Issues"
# for the remaining platform gaps).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (gate)
        run: npx tsc --noEmit
      - name: Unit tests (gate)
        run: npx vitest run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies (ubuntu 24.04)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      # tauri::generate_context! embeds ../dist at compile time, so the
      # frontend must be built before cargo test can compile the lib.
      - name: Build frontend (produces dist/)
        run: npm ci && npm run build
      - name: Rust unit tests
        run: cargo test --lib --locked --manifest-path src-tauri/Cargo.toml
