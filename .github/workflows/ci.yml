# Frontend + Rust unit tests on every push to main and all PRs.
# Docs freshness is covered separately by docs-check.yml.
#
# Both `tsc --noEmit` and `vitest run` are hard gates. The previous
# continue-on-error on vitest existed only for 3 SeedPanel selector
# failures that were fixed in 0.1.2 (see CHANGELOG), so the tolerance is
# gone and a red suite now blocks the PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (gate)
        run: npx tsc --noEmit
      - name: Unit tests (gate)
        run: npx vitest run
      - name: Feedback service tests
        run: node --test feedback-worker/worker.test.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies (ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      # tauri::generate_context! embeds ../dist at compile time, so the
      # frontend must be built before cargo test can compile the lib.
      - name: Build frontend (produces dist/)
        run: npm ci && npm run build
      - name: Rust unit tests
        run: cargo test --lib --locked --manifest-path src-tauri/Cargo.toml
