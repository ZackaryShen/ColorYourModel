# One-shot deployment of the generated docs site to GitHub Pages.
#
# Prerequisite (first run only): repo Settings → Pages → Source = "GitHub
# Actions". Then trigger this workflow manually (Actions → Deploy docs site →
# Run workflow). Pages content is regenerated by `npm run docs:build` and
# committed under docs/site/.

name: Deploy docs site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
