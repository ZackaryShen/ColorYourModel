# One-shot deployment of the HTML doc archives to GitHub Pages.
#
# Prerequisite (first run only): repo Settings → Pages → Source = "GitHub
# Actions". Then trigger this workflow manually (Actions → Deploy docs site →
# Run workflow). The archives are regenerated by `npm run docs:build` and
# committed next to their markdown sources; this workflow stages only the
# *.html files (markdown/tools are not published).

name: Deploy docs site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage HTML-only artifact
        run: |
          mkdir -p pages
          rsync -a --prune-empty-dirs \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            --exclude 'src' --exclude 'src-tauri' --exclude 'legacy' \
            --include 'samples/' --include 'samples/**/' \
            --include 'samples/**/*.png' \
            --exclude 'samples' --exclude 'examples' --exclude 'tests' \
            --include '*/' --include '*.html' --exclude '*' \
            ./ ./pages/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
