[package]
name = "color-your-model"
version = "0.1.0"
description = "3D model coloring tool for 3D printing"
authors = ["ColorYourModel Contributors"]
edition = "2021"

[lib]
name = "color_your_model_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mesh processing
nalgebra = "0.33"
kiddo = "4"

# File parsing
stl_io = "0.7"
quick-xml = "0.36"
zip = "2"

# Algorithms
petgraph = "0.6"

# Logging
log = "0.4"
env_logger = "0.11"
parry3d = "0.30.2"
