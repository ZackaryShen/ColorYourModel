[package]
name = "color-your-model"
version = "0.1.1"
description = "3D model coloring tool for 3D printing"
authors = ["ColorYourModel Contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/ZackaryShen/ColorYourModel"
edition = "2021"

[lib]
name = "color_your_model_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mesh processing
nalgebra = "0.33"
kiddo = "4"

# File parsing
stl_io = "0.7"
image = "0.25"
quick-xml = "0.36"
zip = "2"

# Algorithms
petgraph = "0.6"
rayon = "1"

# Logging
log = "0.4"
env_logger = "0.11"
parry3d = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "sync"] }
semver = "1"

# Dev-build runtime speed: the interactive paths (lasso finalize, paint, fuse)
# are O(mesh) passes over up to 1.5M faces, and unoptimized debug codegen made
# each pass ~10x slower than release (field report: one lasso region took 60s+
# in `tauri dev`; release-measured cost of the same passes is well under 1s).
# opt-level=1 keeps incremental compile times usable while closing most of the
# gap. Dependencies get the same level because petgraph/hashbrown traversal
# dominates the BFS / union-find / adjacency passes.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
